name: Release addon zip

on:
  push:
    tags:
      - "felog-v*"
      - "betterbackpack-v*"
      - "plateband-v*"
      - "wayfarer-v*"
      - "seekwell-v*"
      - "seekwell-locations-v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require tagged commit on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tagged commit $GITHUB_SHA is not an ancestor of origin/main. Merge the change to main first, then tag the merged commit." >&2
            exit 1
          fi

      - name: Resolve addon from tag
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            felog-v*)
              ADDON="ForeverErrorLog"
              VER="${TAG#felog-v}"
              ;;
            betterbackpack-v*)
              ADDON="BetterBackpack"
              VER="${TAG#betterbackpack-v}"
              ;;
            plateband-v*)
              ADDON="Plateband"
              VER="${TAG#plateband-v}"
              ;;
            wayfarer-v*)
              ADDON="Wayfarer"
              VER="${TAG#wayfarer-v}"
              ;;
            seekwell-locations-v*)
              ADDON="Seekwell_Locations"
              VER="${TAG#seekwell-locations-v}"
              ;;
            seekwell-v*)
              ADDON="Seekwell"
              VER="${TAG#seekwell-v}"
              ;;
            *)
              echo "Unsupported tag: $TAG" >&2
              exit 1
              ;;
          esac
          TOC="addons/${ADDON}/${ADDON}.toc"
          TOC_VER="$(grep -E '^## Version:' "$TOC" | head -1 | sed 's/^## Version:[[:space:]]*//;s/[[:space:]]*$//')"
          if [[ "$TOC_VER" != "$VER" ]]; then
            echo "Tag version ($VER) does not match TOC ## Version ($TOC_VER)" >&2
            exit 1
          fi
          echo "addon=$ADDON" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "asset=${ADDON}-${VER}.zip" >> "$GITHUB_OUTPUT"

      - name: Lua syntax check (all addons)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1
          # luac -p also fails on "more than 200 local variables" / "more than 60 upvalues".
          fail=0
          while IFS= read -r f; do
            luac5.1 -p "$f" || fail=1
          done < <(find addons -name '*.lua' -type f)
          exit $fail

      - name: Package zip
        run: |
          chmod +x scripts/package-addon.sh
          ./scripts/package-addon.sh "${{ steps.meta.outputs.addon }}"

      - name: Build release notes
        run: |
          ADDON="${{ steps.meta.outputs.addon }}"
          VER="${{ steps.meta.outputs.version }}"
          CL="addons/${ADDON}/Docs/CHANGELOG.md"
          NOTES=""
          if [[ -f "$CL" ]]; then
            NOTES="$(awk '/^## Release/ { if (found) exit; found=1 } found { print }' "$CL")"
          fi
          if [[ -z "$NOTES" ]]; then
            NOTES="## ${ADDON} ${VER}

          Changelog: \`addons/${ADDON}/Docs/CHANGELOG.md\`"
          fi
          {
            printf '%s\n\n' "$NOTES"
            printf 'Install: extract so `Interface/AddOns/%s/` exists, then `/reload`. The zip root is the `%s/` folder.\n' "$ADDON" "$ADDON"
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.meta.outputs.addon }} ${{ steps.meta.outputs.version }}
          body_path: release-notes.md
          files: dist/${{ steps.meta.outputs.asset }}
          fail_on_unmatched_files: true
